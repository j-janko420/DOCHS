name: DOCHS

on:
  push:
    paths:
      - "dochs/**"
      - "server/**"
      - ".github/workflows/dochs.yml"
  pull_request:
    paths:
      - "dochs/**"
      - "server/**"
      - ".github/workflows/dochs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dochs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dochs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Unit, geometry and DXF tests
        run: npm test
      - name: Build static site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dochs/dist

  server-tests:
    # DOCHS API server (server/): unit and API tests with mocked providers, no keys needed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    # Publishes the default branch to GitHub Pages.
    # One-time setup: repository Settings > Pages > Source: "GitHub Actions".
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
